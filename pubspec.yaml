name: app_core
description: Shared building blocks for every app (purchases, rewarded-ads contract, persistence, settings, audio, review prompt, store and settings screens).
version: 0.3.0
publish_to: none

environment:
  # Lowest versions CI actually tests (see .github/workflows/ci.yml).
  sdk: ^3.13.0
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  audioplayers: ^6.1.0
  in_app_purchase: ^3.2.0
  # Direct access to Play Billing's consume call (see StorePurchaseService).
  in_app_purchase_android: ">=0.4.0 <0.6.0"
  in_app_review: ^2.0.10
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Generates CoreLocalizations from lib/src/l10n/*.arb (see l10n.yaml).
  generate: true
