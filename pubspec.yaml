name: app_core
description: Shared building blocks for every app (purchases, persistence, settings, audio, review prompt, store and settings screens).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  in_app_purchase: ^3.2.0
  # Direct access to Play Billing's consume call (see StorePurchaseService).
  in_app_purchase_android: ">=0.4.0 <0.6.0"
  in_app_review: ^2.0.10
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
